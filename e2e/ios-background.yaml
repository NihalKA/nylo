appId: com.nylohq.nylo
---
- launchApp
- tapOn: "Settings, tab, 3 of 3"
- tapOn: "(?s)Manage AI providers.*"
- assertVisible: "AI providers"
- tapOn: "Edit Owned localhost QA"
- assertVisible: "Edit connection"
- scrollUntilVisible:
    element: "API key"
    direction: DOWN
- tapOn:
    text: "API key"
    index: 1
- inputText: "nylo-ci-placeholder"
- tapOn: "Dismiss keyboard"
- scrollUntilVisible:
    element: "Save connection"
    direction: DOWN
- tapOn: "Save connection"
- assertVisible: "Done"
- tapOn: "Done"
- waitForAnimationToEnd
# The owned-key run showed the iOS Save Password sheet after Done. Never
# save the fixture token to Passwords. Some iOS26 sheets expose no AX children;
# that retained PNG grounds the large-profile Not Now point at (33%,61%).
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible: "Chats, tab, 1 of 3"
    commands:
      - takeScreenshot: background-00-system-password-prompt
      - tapOn:
          point: "33%,61%"
      - waitForAnimationToEnd
- assertVisible: "Chats, tab, 1 of 3"
- tapOn: "Chats, tab, 1 of 3"
- tapOn: "(?s)Open Example: background stream.*"
- tapOn: "Send message"
- tapOn: "Allow & send"
- assertVisible: "Phase one.*"
- pressKey: Home
- takeScreenshot: background-01-home
- runScript:
    file: ../scripts/background-wait.js
    env:
      PHASE: complete
- assertTrue: ${output.backgroundReady}
# launchApp defaults to terminating the process. This step tests app switching;
# the separate explicit stopApp/cold launch at the end still tests restart.
- launchApp:
    stopApp: false
- assertVisible: "Phase one[.] Completed in background[.]"
- assertNotVisible: "Stop response"
- takeScreenshot: background-02-completed
- tapOn: "Go back"
- tapOn: "(?s)Open Example: memory stream.*"
- tapOn: "Send message"
- assertVisible: "Phase one.*"
- pressKey: Home
- runScript:
    file: ../scripts/background-wait.js
    env:
      PHASE: memory
- assertTrue: ${output.backgroundReady}
# launchApp defaults to terminating the process. This step tests app switching;
# the separate explicit stopApp/cold launch at the end still tests restart.
- launchApp:
    stopApp: false
- assertVisible: "(?s)Response paused.*"
- assertNotVisible: "Save memory"
- takeScreenshot: background-03-memory-interrupted
- tapOn: "Go back"
- tapOn: "(?s)Open Example: stop stream.*"
- tapOn: "Send message"
- assertVisible: "Phase one.*"
- tapOn: "Stop response"
- assertVisible: "(?s)Response paused.*"
- assertNotVisible: "Stop response"
- takeScreenshot: background-04-stop
- stopApp
- launchApp
- tapOn: "(?s)Open Owned QA background.*"
- assertVisible: "Phase one[.] Completed in background[.]"
- takeScreenshot: background-05-cold-restored
