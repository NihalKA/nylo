appId: com.nylohq.nylo
---
- launchApp:
    clearState: true
- assertVisible: "Your next idea starts here"
- takeScreenshot: 01-chats-empty
- tapOn:
    text: "Agents, tab, 2 of 3"
    retryTapIfNoChange: true
- assertVisible: "A little more familiar"
- takeScreenshot: 02-agents-empty
- tapOn:
    text: "Settings, tab, 3 of 3"
    retryTapIfNoChange: true
- scrollUntilVisible:
    element: ".*Connect your AI.*"
    direction: DOWN
    centerElement: true
- takeScreenshot: 03-settings
- tapOn: ".*Connect your AI.*"
- assertVisible: "Choose your AI"
- scrollUntilVisible:
    element: "NyloHQ"
    direction: DOWN
- tapOn: "NyloHQ"
- takeScreenshot: 04-provider-setup
- tapOn: "Go back"
- tapOn:
    text: "Chats, tab, 1 of 3"
    retryTapIfNoChange: true
- tapOn: "New chat"
- assertVisible:
    id: "chat-message"
- tapOn:
    id: "chat-message"
- inputText: "A draft that should survive reopening"
- waitForAnimationToEnd
- takeScreenshot: 05-chat-keyboard
- inputText: "\nA second line."
- waitForAnimationToEnd
- takeScreenshot: 05-chat-keyboard-multiline
- tapOn: "Dismiss keyboard"
- assertNotVisible: "Dismiss keyboard"
- takeScreenshot: 05-chat-draft
- tapOn: "Go back"
- tapOn: "(?s)Open New conversation.*"
- assertVisible: "(?s).*A draft that should survive reopening.*"
- stopApp
- launchApp
- tapOn: "(?s)Open New conversation.*"
- assertVisible: "(?s).*A draft that should survive reopening.*"
- takeScreenshot: 06-restored-draft
- tapOn: "Go back"
- tapOn:
    text: "Agents, tab, 2 of 3"
    retryTapIfNoChange: true
- tapOn: "Create agent"
- scrollUntilVisible:
    element: "Writing partner"
    direction: DOWN
- tapOn: "Writing partner"
- takeScreenshot: 07-agent-template
- scrollUntilVisible:
    element: "Create agent"
    direction: DOWN
- tapOn: "Create agent"
- assertVisible: "Your agent"
- scrollUntilVisible:
    element: "Memory"
    direction: DOWN
- tapOn: "Memory"
- scrollUntilVisible:
    element:
      id: "agent-memory-input"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "agent-memory-input"
- inputText: "QA sample: I prefer concise answers."
- assertVisible:
    id: "agent-memory-input"
    text: "QA sample: I prefer concise answers."
- tapOn: "Done"
- assertNotVisible: "Done"
- scrollUntilVisible:
    element: "Save memory"
    direction: DOWN
- assertVisible:
    text: "Save memory"
    enabled: true
- tapOn: "Save memory"
- scrollUntilVisible:
    element: "QA sample: I prefer concise answers."
    direction: UP
- takeScreenshot: 08-agent-memory
- stopApp
- launchApp
- tapOn:
    text: "Agents, tab, 2 of 3"
    retryTapIfNoChange: true
- tapOn: "Open Writing partner"
- scrollUntilVisible:
    element: "Memory"
    direction: DOWN
- tapOn: "Memory"
- scrollUntilVisible:
    element: "QA sample: I prefer concise answers."
    direction: DOWN
- takeScreenshot: 09-restored-memory
