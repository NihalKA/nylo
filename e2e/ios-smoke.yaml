appId: com.nylohq.nylo
---
- launchApp:
    clearState: true
# Wait for the current home screen before testing navigation.
- extendedWaitUntil:
    visible: "How can I help[?]"
    timeout: 120000
- assertVisible: "How can I help[?]"
- takeScreenshot: 01-chats-empty
- tapOn: "History: search, archive and delete chats"
- tapOn:
    text: "Agents"
    index: 1
- assertVisible: "No agents yet"
- takeScreenshot: 02-agents-empty
- tapOn: "Go back"
- tapOn: "Settings"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: ".*Connect your AI.*"
    direction: DOWN
    timeout: 120000
    speed: 40
    waitToSettleTimeoutMs: 500
    # At maximum accessibility text this combined title/detail button is taller
    # than the usable viewport. Center its visible portion before the tap;
    # the next assertion still requires the actual provider screen to open.
    visibilityPercentage: 25
    centerElement: true
- takeScreenshot: 03-settings
- tapOn: ".*Connect your AI.*"
- assertVisible: "AI providers"
- scrollUntilVisible:
    element: "NyloHQ"
    direction: DOWN
- tapOn: "NyloHQ"
- takeScreenshot: 04-provider-setup
# The retained compact failure shows this system banner covering Go back;
# tapping through it opened iOS Settings. Keep the navigation check unchanged.
- extendedWaitUntil:
    notVisible: "(?s).*Ready for Apple Intelligence.*"
    timeout: 15000
- tapOn: "Go back"
- tapOn: "Go back"
- assertVisible: "How can I help[?]"
- assertVisible:
    id: "chat-message"
- tapOn:
    id: "chat-message"
- inputText: "A draft that should survive reopening"
- waitForAnimationToEnd
- takeScreenshot: 05-chat-keyboard
- inputText: "\nA second line."
- assertVisible:
    id: "chat-message"
    text: "(?s).*A second line.*"
- waitForAnimationToEnd
- takeScreenshot: 05-chat-keyboard-multiline
# Inline Chat has no header dismissal control; use the OS keyboard action.
- hideKeyboard
- assertVisible:
    id: "chat-message"
    text: '(?s)A draft that should survive reopening\nA second line[.]'
- takeScreenshot: 05-chat-draft
- tapOn: "Add attachment"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Photo library"
    direction: DOWN
- assertVisible: "Photo library"
- scrollUntilVisible:
    element: "Cancel attachments"
    direction: DOWN
- takeScreenshot: 05-attachment-menu
- tapOn: "Cancel attachments"
- assertVisible:
    id: "chat-message"
# The active unsent draft lives on Home and is excluded from history.
- tapOn: "Agent"
- tapOn: "Chat"
- assertVisible:
    id: "chat-message"
    text: '(?s)A draft that should survive reopening\nA second line[.]'
- assertVisible: "(?s).*A draft that should survive reopening.*"
- stopApp
- launchApp
# Cold launch resumes the unsent draft directly on Home.
- assertVisible:
    id: "chat-message"
    text: '(?s)A draft that should survive reopening\nA second line[.]'
- assertVisible: "(?s).*A draft that should survive reopening.*"
- takeScreenshot: 06-restored-draft
- tapOn: "History: search, archive and delete chats"
- tapOn:
    text: "Agents"
    index: 1
- tapOn: "Create agent"
- assertVisible: "Create an agent"
- waitForAnimationToEnd
# The fixed Save bar covers the lowest part of the scrolling viewport.
# Center the complete role target before applying it, then verify its result.
- scrollUntilVisible:
    element:
      text: "Writing partner"
      below: "Create an agent"
      above: "Create agent"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    text: "Writing partner"
    below: "Create an agent"
    above: "Create agent"
- scrollUntilVisible:
    element:
      id: "agent-name"
    direction: DOWN
    visibilityPercentage: 100
- assertVisible:
    id: "agent-name"
    text: "Writing partner"
- runFlow:
    when:
      visible: "Dismiss keyboard"
    commands:
      - tapOn: "Dismiss keyboard"
      - assertNotVisible: "Dismiss keyboard"
- takeScreenshot: 07-agent-template
- repeat:
    times: 10
    commands:
      - runFlow:
          when:
            notVisible: "Create agent"
          commands:
            - swipe:
                direction: UP
            - runFlow:
                when:
                  visible: "Dismiss keyboard"
                commands:
                  - tapOn: "Dismiss keyboard"
                  - assertNotVisible: "Dismiss keyboard"
# Save is now fixed outside the scroll view. Keep the complete-target check,
# but do not try to scroll a docked action into the centre of the screen.
- scrollUntilVisible:
    element: "Create agent"
    direction: DOWN
    centerElement: false
    visibilityPercentage: 100
- assertVisible: "Create agent"
- tapOn: "Create agent"
- assertVisible: "Agent"
# Centre the Memory tab below the fixed Agent header before selecting it.
- scrollUntilVisible:
    element:
      text: "Memory"
      below: "Agent"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    text: "Memory"
    below: "Agent"
- scrollUntilVisible:
    element:
      id: "agent-memory-input"
    direction: DOWN
    centerElement: true
# Maximum text can overscroll the editor to y0–118 behind the fixed header.
# Screen visibility alone counted that occluded frame as 100%; bring the whole
# editor below the header before the existing single focus tap.
- scrollUntilVisible:
    element:
      id: "agent-memory-input"
      below: "Agent"
    direction: UP
    centerElement: true
- tapOn:
    id: "agent-memory-input"
- inputText: "QA sample: I prefer concise answers."
- assertVisible:
    id: "agent-memory-input"
    text: "QA sample: I prefer concise answers."
- tapOn: "Dismiss keyboard"
- assertNotVisible: "Dismiss keyboard"
- scrollUntilVisible:
    element: "Save memory"
    direction: DOWN
- assertVisible:
    text: "Save memory"
    enabled: true
- tapOn: "Save memory"
# Saved memories follow the editor and Save action; compact/maximum text place
# the new row below the viewport. Search toward it without reducing visibility.
- scrollUntilVisible:
    element: "QA sample: I prefer concise answers."
    direction: DOWN
- takeScreenshot: 08-agent-memory
- tapOn: "Go back"
- waitForAnimationToEnd
- assertVisible: "Create agent"
- tapOn: "Open Writing partner"
# Centre the Memory tab below the fixed Agent header before selecting it.
- scrollUntilVisible:
    element:
      text: "Memory"
      below: "Agent"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    text: "Memory"
    below: "Agent"
- scrollUntilVisible:
    element: "QA sample: I prefer concise answers."
    direction: DOWN
- assertVisible: "QA sample: I prefer concise answers."
- takeScreenshot: 08b-memory-navigation-restored
- stopApp
- launchApp
- tapOn: "History: search, archive and delete chats"
- tapOn:
    text: "Agents"
    index: 1
- tapOn: "Open Writing partner"
# Centre the Memory tab below the fixed Agent header before selecting it.
- scrollUntilVisible:
    element:
      text: "Memory"
      below: "Agent"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    text: "Memory"
    below: "Agent"
- scrollUntilVisible:
    element: "QA sample: I prefer concise answers."
    direction: DOWN
- takeScreenshot: 09-restored-memory
# Center the complete action before tapping. The retained standard-size AX
# exposes duplicate Agent title nodes; its relative below selector rejected a
# button at y194–242 below both titles at y75–104. Use full visibility and
# centering to keep the action clear of the fixed header and bottom tabs.
- scrollUntilVisible:
    element: "New conversation"
    direction: UP
    visibilityPercentage: 100
    centerElement: true
    timeout: 120000
    waitToSettleTimeoutMs: 500
- tapOn: "New conversation"
- tapOn:
    id: "chat-message"
- inputText: "An agent draft\nwith a second line."
- assertVisible:
    id: "chat-message"
    text: "(?s).*with a second line.*"
- waitForAnimationToEnd
- takeScreenshot: 10-agent-chat-keyboard
- tapOn: "Dismiss keyboard"
- assertNotVisible: "Dismiss keyboard"
- takeScreenshot: 11-agent-chat-context
