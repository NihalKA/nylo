appId: com.nylohq.nylo
---
- launchApp
- assertVisible: "Open Example: A focused morning"
- takeScreenshot: gallery-01-inbox
- tapOn: "Open Example: A focused morning"
- assertVisible: "(?s).*Start with one meaningful task.*"
- takeScreenshot: gallery-02-response
- tapOn: "Copy response"
- tapOn: "Go back"
- tapOn: "Open Example: A clear project update.*"
- assertVisible: "(?s).*Hi team.*"
- takeScreenshot: gallery-03-agent-response
- tapOn: "Go back"
- tapOn: "Open Example: Recover a connection"
- assertVisible: "Retry response"
- takeScreenshot: gallery-04-recovery
- tapOn: "Go back"
- tapOn: "Open Example: A longer conversation"
- extendedWaitUntil:
    visible: "Latest example answer: history is intact."
    timeout: 30000
- takeScreenshot: gallery-05-long-history
- tapOn: "Go back"
- tapOn: "Settings, tab, 3 of 3"
- scrollUntilVisible:
    element: "Live device check"
    direction: DOWN
- tapOn: "Live device check"
- tapOn: "Prepare local test"
- assertVisible: "Not run"
- tapOn: "Go back"
- tapOn: "Chats, tab, 1 of 3"
- tapOn: "New chat"
- tapOn:
    id: "chat-message"
- inputText: "Personal draft kept outside device check"
- tapOn: "Dismiss keyboard"
- tapOn: "Go back"
- tapOn: "Settings, tab, 3 of 3"
- scrollUntilVisible:
    element: "Live device check"
    direction: DOWN
- tapOn: "Live device check"
- scrollUntilVisible:
    element: "Approve & save test memory"
    direction: DOWN
    centerElement: true
- tapOn: "Approve & save test memory"
- assertVisible: "Saved in the test agent’s memory."
- takeScreenshot: gallery-06-device-check-memory
- stopApp
- launchApp
- tapOn: "Settings, tab, 3 of 3"
- scrollUntilVisible:
    element: "Live device check"
    direction: DOWN
- tapOn: "Live device check"
- scrollUntilVisible:
    element: "Check after reopening"
    direction: DOWN
- tapOn: "Check after reopening"
- assertVisible: "(?s)Passed: a new app session restored.*"
- takeScreenshot: gallery-07-device-check-reopened
- scrollUntilVisible:
    element: "Remove test data"
    direction: DOWN
- tapOn: "Remove test data"
- tapOn: "Remove"
- assertVisible: "Prepare local test"
- tapOn: "Go back"
- tapOn: "Chats, tab, 1 of 3"
- assertVisible: "(?s).*Personal draft kept outside device check.*"
- takeScreenshot: gallery-08-personal-draft-preserved
