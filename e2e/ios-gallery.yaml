# The observed first-run Apple Intelligence banner covered the header back tap.
# Exercise native edge-back below that OS banner, then prove the expected route.
- swipe:
    start: "1%,50%"
    end: "85%,50%"
    duration: 400
- assertNotVisible: "Report preview"
- assertVisible: "Choose model connection.*"
- scrollUntilVisible:
    element: "Copy response"
    direction: DOWN
- tapOn: "Copy response"
