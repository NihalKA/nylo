appId: com.nylohq.nylo
---
- launchApp
- assertVisible: "Example: A focused morning"
- takeScreenshot: gallery-01-inbox
- tapOn: "Open Example: A focused morning"
- assertVisible: "(?s).*Start with one meaningful task.*"
- takeScreenshot: gallery-02-response
- tapOn: "Copy response"
- tapOn: "Go back"
- tapOn: "Open Example: A clear project update.*"
- assertVisible: "(?s).*Hi team.*"
- takeScreenshot: gallery-03-agent-response
- tapOn: "Go back"
- tapOn: "Open Example: Recover a connection"
- assertVisible: "Retry response"
- takeScreenshot: gallery-04-recovery
- tapOn: "Go back"
- tapOn: "Open Example: A longer conversation"
- extendedWaitUntil:
    visible: "Latest example answer: history is intact."
    timeout: 30000
- takeScreenshot: gallery-05-long-history
