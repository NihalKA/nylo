appId: com.nylohq.nylo
---
- launchApp
- assertVisible: "(?s)Open Example: A focused morning.*"
- takeScreenshot: gallery-01-inbox
- tapOn: "(?s)Open Example: A focused morning.*"
- assertVisible: "(?s).*Start with one meaningful task.*"
- takeScreenshot: gallery-02-response
- tapOn: "Copy response"
- tapOn: "Choose model connection.*"
- assertVisible: "Choose a model"
- assertNotVisible: "Conversation title"
- takeScreenshot: gallery-02b-model-picker
- tapOn: "Offline QA alternate.*"
- assertNotVisible: "Close model picker"
- assertVisible: "synthetic-alternate"
- tapOn: "Choose model connection.*"
- tapOn: "Close model picker"
- tapOn: "Go back"
- tapOn: "(?s)Open Example: A clear project update.*"
- assertVisible: "(?s).*Hi team.*"
- takeScreenshot: gallery-03-agent-response
- tapOn: "Go back"
- tapOn: "(?s)Open Example: Recover a connection.*"
- assertVisible: "Retry response"
- takeScreenshot: gallery-04-recovery
- tapOn: "Go back"
- tapOn: "(?s)Open Example: A longer conversation.*"
- extendedWaitUntil:
    visible: "Latest example answer: history is intact."
    timeout: 30000
- scrollUntilVisible:
    element: "Latest example answer: history is intact."
    direction: DOWN
- assertVisible: "Latest example answer: history is intact."
- takeScreenshot: gallery-05-long-history
- tapOn: "Go back"
- tapOn: "Settings, tab, 3 of 3"
- scrollUntilVisible:
    element: "Live device check.*"
    direction: DOWN
- tapOn: "Live device check.*"
- tapOn: "Prepare local test"
- assertVisible: "Not run"
- tapOn: "Go back"
- tapOn: "Chats, tab, 1 of 3"
- tapOn: "New chat"
- tapOn: "Help me write"
- assertVisible:
    id: "chat-message"
    text: "(?s)Help me write.*"
- tapOn:
    id: "chat-message"
- inputText: "Personal draft kept outside device check"
- tapOn: "Dismiss keyboard"
- assertNotVisible: "Help me write"
- assertNotVisible: "Think it through"
- tapOn: "Go back"
- tapOn: "Settings, tab, 3 of 3"
- scrollUntilVisible:
    element: "Live device check.*"
    direction: DOWN
- tapOn: "Live device check.*"
- scrollUntilVisible:
    element: "Approve & save test memory"
    direction: DOWN
    centerElement: true
- tapOn: "Approve & save test memory"
- assertVisible: "Saved in the test agent’s memory."
- takeScreenshot: gallery-06-device-check-memory
- stopApp
- launchApp
- tapOn: "Settings, tab, 3 of 3"
- scrollUntilVisible:
    element: "Live device check.*"
    direction: DOWN
- tapOn: "Live device check.*"
- scrollUntilVisible:
    element: "Check after reopening"
    direction: DOWN
- tapOn: "Check after reopening"
- assertVisible: "(?s)Passed: a new app session restored.*"
- takeScreenshot: gallery-07-device-check-reopened
- scrollUntilVisible:
    element: "Remove test data"
    direction: DOWN
- tapOn: "Remove test data"
- tapOn: "Remove"
- assertVisible: "Prepare local test"
- tapOn: "Go back"
- tapOn: "Chats, tab, 1 of 3"
- assertVisible: "(?s).*Personal draft kept outside device check.*"
- takeScreenshot: gallery-08-personal-draft-preserved
- tapOn: "Agents, tab, 2 of 3"
- tapOn: "Create agent"
- scrollUntilVisible:
    element:
      id: "agent-name"
    direction: DOWN
- tapOn:
    id: "agent-name"
- inputText: "Keep this role draft"
- tapOn: "Dismiss keyboard"
- scrollUntilVisible:
    element: "Writing partner"
    direction: UP
- tapOn: "Writing partner"
- tapOn: "Cancel"
- assertVisible:
    id: "agent-name"
    text: "Keep this role draft"
- tapOn: "Writing partner"
- tapOn: "Use role"
- assertVisible:
    id: "agent-name"
    text: "Writing partner"
- takeScreenshot: gallery-09-role-replacement-confirmed
