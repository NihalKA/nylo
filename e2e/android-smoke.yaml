appId: com.nylohq.nylo
---
- launchApp:
    clearState: true
# API35's Pixel Launcher ANR was independently captured twice over Nylo.
# Handle only that named OS component, then retain every Nylo assertion.
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "android:id/alertTitle"
        text: "Pixel Launcher isn't responding"
    commands:
      - takeScreenshot: 00-pixel-launcher-anr
      - tapOn:
          id: "android:id/aerr_close"
          text: "Close app"
          retryTapIfNoChange: false
      - assertNotVisible: "Pixel Launcher isn't responding"
- extendedWaitUntil:
    visible: "How can I help[?]"
    timeout: 120000
- assertVisible: "How can I help[?]"
- takeScreenshot: 01-chats-empty
- tapOn: "History: search, archive and delete chats"
- tapOn:
    text: "Agents"
    index: 1
- assertVisible: "No agents yet"
- takeScreenshot: 02-agents-empty
- tapOn: "Go back"
- tapOn:
    text: "Settings"
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element: ".*Connect your AI.*"
    direction: DOWN
    timeout: 120000
    speed: 80
    waitToSettleTimeoutMs: 500
- takeScreenshot: 03-settings
- tapOn: ".*Connect your AI.*"
- assertVisible: "AI providers"
- scrollUntilVisible:
    element: "NyloHQ"
    direction: DOWN
- tapOn: "NyloHQ"
- takeScreenshot: 04-provider-setup
- tapOn: "Go back"
- tapOn: "Go back"
- assertVisible: "How can I help[?]"
- assertVisible:
    id: "chat-message"
- tapOn:
    id: "chat-message"
- inputText: "A draft that should survive reopening"
- waitForAnimationToEnd
- takeScreenshot: 05-chat-keyboard
- pressKey: Enter
- inputText: "A second line."
- assertVisible:
    id: "chat-message"
    text: '(?s)A draft that should survive reopening\nA second line[.]'
- waitForAnimationToEnd
- takeScreenshot: 05-chat-keyboard-multiline
# Inline Chat has no header dismissal control; use the OS keyboard action.
- hideKeyboard
- assertVisible:
    id: "chat-message"
    text: '(?s)A draft that should survive reopening\nA second line[.]'
- takeScreenshot: 05-chat-draft
- tapOn: "Add attachment"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Photo library"
    direction: DOWN
- assertVisible: "Photo library"
- scrollUntilVisible:
    element: "Cancel attachments"
    direction: DOWN
- takeScreenshot: 05-attachment-menu
- tapOn: "Cancel attachments"
- assertVisible:
    id: "chat-message"
# The active unsent draft lives on Home and is excluded from history.
- tapOn: "Agent"
- tapOn: "Chat"
- assertVisible: "(?s).*A draft that should survive reopening.*"
- stopApp
- launchApp
# Cold launch resumes the unsent draft directly on Home.
- assertVisible: "(?s).*A draft that should survive reopening.*"
- assertVisible:
    id: "chat-message"
    text: '(?s)A draft that should survive reopening\nA second line[.]'
- takeScreenshot: 06-restored-draft
- tapOn: "History: search, archive and delete chats"
- tapOn:
    text: "Agents"
    index: 1
- tapOn: "Create agent"
- assertVisible: "Create an agent"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Writing partner"
    direction: UP
- tapOn: "Writing partner"
- runFlow:
    when:
      visible: "Dismiss keyboard"
    commands:
      - tapOn: "Dismiss keyboard"
      - assertNotVisible: "Dismiss keyboard"
- takeScreenshot: 07-agent-template
- repeat:
    times: 10
    commands:
      - runFlow:
          when:
            notVisible: "Create agent"
          commands:
            - swipe:
                direction: UP
            - runFlow:
                when:
                  visible: "Dismiss keyboard"
                commands:
                  - tapOn: "Dismiss keyboard"
                  - assertNotVisible: "Dismiss keyboard"
- assertVisible: "Create agent"
- tapOn: "Create agent"
- assertVisible: "Agent"
- scrollUntilVisible:
    element: "Memory"
    direction: DOWN
- tapOn: "Memory"
- scrollUntilVisible:
    element:
      id: "agent-memory-input"
    direction: DOWN
    centerElement: true
# Maximum text can overscroll the editor to y0–118 behind the fixed header.
# Screen visibility alone counted that occluded frame as 100%; bring the whole
# editor below the header before the existing single focus tap.
- scrollUntilVisible:
    element:
      id: "agent-memory-input"
      below: "Agent"
    direction: UP
    centerElement: true
- tapOn:
    id: "agent-memory-input"
- inputText: "QA sample: I prefer concise answers."
- assertVisible:
    id: "agent-memory-input"
    text: "QA sample: I prefer concise answers."
- tapOn: "Dismiss keyboard"
- assertNotVisible: "Dismiss keyboard"
- scrollUntilVisible:
    element: "Save memory"
    direction: DOWN
- assertVisible:
    text: "Save memory"
    enabled: true
- tapOn: "Save memory"
# Saved memories follow the editor and Save action; compact/maximum text place
# the new row below the viewport. Search toward it without reducing visibility.
- scrollUntilVisible:
    element: "QA sample: I prefer concise answers."
    direction: DOWN
- takeScreenshot: 08-agent-memory
- tapOn: "Go back"
- waitForAnimationToEnd
- assertVisible: "Create agent"
- tapOn: "Open Writing partner"
- scrollUntilVisible:
    element: "Memory"
    direction: DOWN
- tapOn: "Memory"
- scrollUntilVisible:
    element: "QA sample: I prefer concise answers."
    direction: DOWN
- assertVisible: "QA sample: I prefer concise answers."
- takeScreenshot: 08b-memory-navigation-restored
- stopApp
- launchApp
- tapOn: "History: search, archive and delete chats"
- tapOn:
    text: "Agents"
    index: 1
- tapOn: "Open Writing partner"
- scrollUntilVisible:
    element: "Memory"
    direction: DOWN
- tapOn: "Memory"
- scrollUntilVisible:
    element: "QA sample: I prefer concise answers."
    direction: DOWN
- takeScreenshot: 09-restored-memory
# Actual maximum-text AX placed this button at y26–187 behind the fixed Agent
# header. Require the whole target below that header before the same single tap.
- scrollUntilVisible:
    element:
      text: "New conversation"
      below: "Agent"
    direction: UP
    centerElement: true
- tapOn: "New conversation"
- tapOn:
    id: "chat-message"
- inputText: "An agent draft"
- pressKey: Enter
- inputText: "with a second line."
- assertVisible:
    id: "chat-message"
    text: '(?s)An agent draft\nwith a second line[.]'
- waitForAnimationToEnd
- takeScreenshot: 10-agent-chat-keyboard
- tapOn: "Dismiss keyboard"
- assertNotVisible: "Dismiss keyboard"
- takeScreenshot: 11-agent-chat-context
