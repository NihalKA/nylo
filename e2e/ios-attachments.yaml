appId: com.nylohq.nylo
---
- launchApp
- tapOn: "(?s)Open Example: A focused morning.*"
# Disposable CI Photos gets only our green 32x32 JPEG with synthetic EXIF.
# Prior PNG evidence grounded index 0 as newest; inspect the new JPEG run
# PNG/AX to confirm that ordering and actual owned selection still hold.
- tapOn:
    id: "chat-message"
- inputText: "QA photo draft stays safe"
- tapOn: "Dismiss keyboard"
- assertNotVisible: "Dismiss keyboard"
- tapOn: "Add attachment"
- tapOn: "Photo library"
- extendedWaitUntil:
    visible:
      id: "PXGGridLayout-Info"
      index: 0
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    id: "PXGGridLayout-Info"
    index: 0
    retryTapIfNoChange: false
- assertVisible:
    text: "Done"
    enabled: true
- tapOn:
    text: "Done"
    retryTapIfNoChange: false
# Wait for preparation to settle, including its bounded failure path; preview
# remains mandatory. A timeout error must fail this assertion, never pass it.
- extendedWaitUntil:
    visible:
      text: "Add attachment"
      enabled: true
    timeout: 30000
- assertVisible: "QA photo draft stays safe"
- takeScreenshot: attachments-01a-preparation-settled
- assertVisible: "Preview Photo.jpg"
- assertVisible: "Remove Photo.jpg"
- takeScreenshot: attachments-01b-selected-owned-photo
- stopApp
- launchApp
- tapOn: "(?s)Open Example: A focused morning.*"
- assertVisible: "QA photo draft stays safe"
- assertVisible: "Preview Photo.jpg"
- assertVisible: "Remove Photo.jpg"
- takeScreenshot: attachments-01c-restored-owned-photo
- tapOn: "Remove Photo.jpg"
- assertNotVisible: "Preview Photo.jpg"
- assertNotVisible: "Remove Photo.jpg"
- assertVisible:
    id: "chat-message"
# Keep cancellation coverage after import so it cannot hide renderer evidence.
- tapOn: "Add attachment"
- tapOn: "Photo library"
# Cancel exists on the loading screen and moves when Photos finishes loading.
# Wait for the actual grid before taking evidence or making a single tap.
- extendedWaitUntil:
    visible:
      id: "PXGGridLayout-Info"
      index: 0
    timeout: 60000
- assertVisible: "Cancel"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: attachments-01-system-photo-picker
- tapOn:
    text: "Cancel"
    waitToSettleTimeoutMs: 1000
    retryTapIfNoChange: false
- assertVisible:
    id: "chat-message"
- tapOn: "Add attachment"
- tapOn: "Choose files"
# The failure AX had a 1-point transitional Cancel; the loaded Files toolbar
# has Browse and the final Cancel frame. Do not tap the transitioning hierarchy.
- assertVisible: "Browse"
- assertVisible: "Cancel"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: attachments-02-system-file-picker
- tapOn:
    text: "Cancel"
    waitToSettleTimeoutMs: 1000
    retryTapIfNoChange: false
# The actual iOS26 Files sheet retained its loaded Recents/Browse hierarchy
# after the first native Cancel tap. Allow one further tap only while that
# exact system picker still owns the screen; keep all app/storage assertions.
- runFlow:
    when:
      notVisible:
        id: "chat-message"
    commands:
      - assertVisible: "Recents"
      - assertVisible: "Browse"
      - assertVisible: "Cancel"
      - takeScreenshot: attachments-02b-system-file-picker-cancel-recovery
      - tapOn:
          text: "Cancel"
          waitToSettleTimeoutMs: 1000
          retryTapIfNoChange: false
- assertVisible:
    id: "chat-message"
- tapOn: "Add attachment"
- tapOn: "Take a photo"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- assertVisible:
    id: "chat-message"
- assertVisible: "Add attachment"
- assertVisible: "(?si).*camera.*"
- waitForAnimationToEnd
- takeScreenshot: attachments-03-simulator-camera-fallback
# Recovery must permit another action, not merely leave the chat visible.
- assertVisible:
    text: "Add attachment"
    enabled: true
# The observed center tap placed the caret before the final word. Target the
# trailing/bottom space of this AX-resolved field to deliberately append.
- tapOn:
    id: "chat-message"
    point: "95%,90%"
- inputText: " after camera fallback"
- assertVisible: "QA photo draft stays safe after camera fallback"
- tapOn: "Dismiss keyboard"
- assertNotVisible: "Dismiss keyboard"
- tapOn: "Add attachment"
- assertVisible: "Photo library"
- tapOn: "Cancel attachments"
- assertVisible:
    id: "chat-message"
    enabled: true
- takeScreenshot: attachments-04-camera-recovery-interaction

# A second import gets a fresh identity (no content deduplication). Retain it for
# post-flow SQLite inspection; orphan checking must still catch the removed first.
- tapOn: "Add attachment"
- tapOn: "Photo library"
- extendedWaitUntil:
    visible:
      id: "PXGGridLayout-Info"
      index: 0
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: attachments-05a-owned-metadata-picker
- tapOn:
    id: "PXGGridLayout-Info"
    index: 0
    retryTapIfNoChange: false
- assertVisible:
    text: "Done"
    enabled: true
- tapOn:
    text: "Done"
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      text: "Add attachment"
      enabled: true
    timeout: 30000
- assertVisible: "QA photo draft stays safe after camera fallback"
- assertVisible: "Preview Photo.jpg"
- assertVisible: "Remove Photo.jpg"
# This path requires the 2517 source: a new successful import clears the old
# local camera error before restart, rather than relying on remount to hide it.
- assertNotVisible: "Camera is unavailable on this device[.] Choose Photo library or files instead[.]"
- takeScreenshot: attachments-05b-retained-owned-metadata-photo
- stopApp
- launchApp
- tapOn: "(?s)Open Example: A focused morning.*"
- assertVisible: "QA photo draft stays safe after camera fallback"
- assertVisible: "Preview Photo.jpg"
- assertVisible: "Remove Photo.jpg"
- takeScreenshot: attachments-05c-restored-owned-metadata-photo
