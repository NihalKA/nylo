appId: com.nylohq.nylo
---
- launchApp
- tapOn: "(?s)Open Example: A focused morning.*"
- tapOn: "Add attachment"
- tapOn: "Photo library"
# Native presenters arrive after the React source sheet dismisses. Wait for them
# before evidence or input; the earlier captures showed the underlying chat.
- assertVisible: "Cancel"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: attachments-01-system-photo-picker
- tapOn:
    text: "Cancel"
    waitToSettleTimeoutMs: 1000
    retryTapIfNoChange: false
- assertVisible:
    id: "chat-message"
- tapOn: "Add attachment"
- tapOn: "Choose files"
# The failure AX had a 1-point transitional Cancel; the loaded Files toolbar
# has Browse and the final Cancel frame. Do not tap the transitioning hierarchy.
- assertVisible: "Browse"
- assertVisible: "Cancel"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: attachments-02-system-file-picker
- tapOn:
    text: "Cancel"
    waitToSettleTimeoutMs: 1000
    retryTapIfNoChange: false
- assertVisible:
    id: "chat-message"
- tapOn: "Add attachment"
- tapOn: "Take a photo"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- assertVisible:
    id: "chat-message"
- assertVisible: "Add attachment"
- assertVisible: "(?si).*camera.*"
- waitForAnimationToEnd
- takeScreenshot: attachments-03-simulator-camera-fallback
