appId: com.nylohq.nylo
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Close app"
- assertVisible: "How can I help[?]"
- tapOn: "Settings"
- scrollUntilVisible:
    element: ".*Restore backup.*"
    direction: DOWN
- tapOn: ".*Restore backup.*"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible: "Nylo-foreground-demo.json"
    commands:
      - tapOn: "Show roots"
      - tapOn: "Downloads"
- tapOn: "Nylo-foreground-demo.json"
- assertVisible: "Replace local data?"
- tapOn: "Restore"
- scrollUntilVisible:
    element: "Backup restored. Add your API keys to continue."
    direction: DOWN
- assertVisible: "Backup restored. Add your API keys to continue."
- scrollUntilVisible:
    element: ".*Manage AI providers.*"
    direction: UP
- tapOn: ".*Manage AI providers.*"
- tapOn: "Edit Synthetic review demo"
- scrollUntilVisible:
    element: "API key"
    direction: DOWN
- tapOn:
    text: "API key"
    index: 1
- inputText: "nylo-ci-placeholder"
- tapOn: "Dismiss keyboard"
- scrollUntilVisible:
    element: "Save connection"
    direction: DOWN
- tapOn: "Save connection"
- tapOn: "Done"
- tapOn: "Go back"
- assertVisible: "Demonstrate a user-initiated synthetic download continuing on Home."
- assertVisible: "Send message"
