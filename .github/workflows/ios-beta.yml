name: iOS signed beta
on:
  workflow_dispatch:
    inputs:
      build_stamp:
        description: Shared UTC identity timestamp for signed and simulator candidates
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ios-beta
  cancel-in-progress: false
jobs:
  beta:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/feat/figma-ui-parity' || github.ref == 'refs/heads/feat/ai-sdk-mobile-capabilities' || github.ref == 'refs/heads/fix/background-response-lifecycle'))
    # Standard Intel runner avoids the macOS arm64 capacity shortage.
    runs-on: macos-26-intel
    environment: apple-release
    timeout-minutes: 60
    env:
      CI: '1'
      NYLO_BUILD_STAMP: ${{ inputs.build_stamp }}
      EXPO_NO_TELEMETRY: '1'
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '120'
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: '3'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact source and clear generated caches
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git ls-files ios android)"
          rm -rf .expo dist node_modules/.cache ios artifacts
          echo "npm_config_cache=$RUNNER_TEMP/nylo-ios-npm/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199
        with:
          ruby-version: '3.3.13'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: python3 scripts/check-design-fonts.py
      - run: python3 scripts/check-design-assets.py
      - name: Record iOS source marker
        run: python3 scripts/ios-build-identity.py prepare
      - run: node scripts/security-check.mjs
      - run: bundle install
      - name: Build and upload to TestFlight
        run: bundle exec fastlane ios beta
        env:
          IOS_BUILD_NUMBER: ${{ github.run_number }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          CI_KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ios-beta-diagnostics-${{ github.run_id }}
          path: |
            ~/Library/Logs/gym/*.log
            Gemfile.lock
            artifacts/native-privacy-audit.log
            artifacts/ipa-signing-audit.json
            artifacts/ios-build-identity.json
            artifacts/ios-bundle-verification.json
          if-no-files-found: ignore
          retention-days: 7
