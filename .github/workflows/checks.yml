name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/security-check.mjs
      - run: python3 scripts/check-design-fonts.py
      - run: python3 scripts/check-design-assets.py
      # Tests the gate; it does not assert that incomplete visual coverage passes.
      - run: python3 -m unittest discover -s tests -p 'test_figma_coverage.py'
      - run: npm run format:check
      - run: npm run check
      - run: npx expo-doctor
