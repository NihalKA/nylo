name: Android emulator validation
on:
  workflow_run:
    workflows: ['Android signed builds']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Android signed builds run
        required: true
      allow_failed_audit:
        description: Revalidate existing compiled binaries after a test-only audit-parser correction
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: android-ui-${{ inputs.source_run_id || github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  emulator:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
      ALLOW_FAILED_AUDIT: ${{ inputs.allow_failed_audit || false }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact signed APK
        run: |
          mkdir -p artifacts/android-ui
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > artifacts/android-ui/source-run.json
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          r=json.loads(Path('artifacts/android-ui/source-run.json').read_text())
          assert r['name']=='Android signed builds' and r['head_branch']=='main'
          assert r['conclusion']=='success' or (os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch' and os.environ['ALLOW_FAILED_AUDIT']=='true')
          assert r['head_repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          subprocess.run(['gh','run','download',str(r['id']),'--repo',os.environ['GITHUB_REPOSITORY'],'--name',f"android-{r['run_number']}-{r['head_sha']}",'--dir','artifacts/android-build'],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as env: env.write('ANDROID_VERSION_CODE='+str(r['run_number'])+'\n')
          Path('artifacts/android-ui/provenance.txt').write_text(f"Native APK source: {r['head_sha']}\nNative run: {r['id']}\nFlow source: "+subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          PY
          sha256sum artifacts/android-build/Nylo-test.apk > artifacts/android-ui/apk-sha256.txt
          sha256sum e2e/android-smoke.yaml scripts/android/ui-smoke.sh > artifacts/android-ui/fixture-sha256.txt
      - name: Revalidate actual compiled binaries and release identity
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose --print-certs artifacts/android-build/Nylo-test.apk > artifacts/android-build/signature.txt
          "$build_tools/aapt2" dump badging artifacts/android-build/Nylo-test.apk > artifacts/android-build/package.txt
          "$build_tools/aapt2" dump permissions artifacts/android-build/Nylo-test.apk > artifacts/android-build/permissions.txt
          "$build_tools/aapt2" dump xmltree artifacts/android-build/Nylo-test.apk --file AndroidManifest.xml > artifacts/android-build/manifest.txt
          keytool -J-Duser.language=en -printcert -jarfile artifacts/android-build/Nylo-release.aab > artifacts/android-build/aab-certificate.txt
          jarsigner -verify artifacts/android-build/Nylo-release.aab > artifacts/android-build/aab-signature.txt
          python3 scripts/android/audit.py artifacts/android-build
          cp artifacts/android-build/audit.json artifacts/android-ui/compiled-audit.json
      - name: Validate AAB with pinned Google bundletool
        run: |
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=artifacts/android-build/Nylo-release.aab > artifacts/android-ui/bundle-validation.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none'
          script: bash scripts/android/ui-smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-ui-${{ github.run_id }}
          path: artifacts/android-ui/
          if-no-files-found: ignore
          retention-days: 14
