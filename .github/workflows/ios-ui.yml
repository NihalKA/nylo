name: iPhone UI smoke
on:
  workflow_run:
    workflows: ['iOS native validation']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful native validation run containing the simulator app
        required: true
      refresh_js_bundle:
        description: Embed current JS into a compatible simulator runtime (UI evidence only)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-ui-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        profile: [compact, large, large-text]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: inputs.refresh_js_bundle
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: inputs.refresh_js_bundle
      - name: Install app, exercise first-use flows, capture evidence
        run: bash scripts/ios-smoke.sh
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
          UI_PROFILE: ${{ matrix.profile }}
          REFRESH_JS_BUNDLE: ${{ inputs.refresh_js_bundle && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: iphone-ui-${{ github.run_id }}-${{ matrix.profile }}
          path: artifacts/e2e
          retention-days: 7
