name: iOS native validation
on:
  push:
    branches: [main]
    paths: ['app/**', 'src/**', 'assets/**', 'app.json', 'package*.json', 'scripts/ios-simulator.sh', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      RCT_NO_LAUNCH_PACKAGER: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: xcodebuild -version
      - run: bash scripts/ios-simulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-simulator-${{ github.sha }}
          path: |
            artifacts/*.png
            artifacts/*.zip
            artifacts/*.log
          if-no-files-found: ignore
          retention-days: 7
